<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <title>Landing Page</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximun-scale=1.0">
    <meta charset="description" content="Conteúdo do meu site.">
    <meta charset="keywords" content="palavras, separadas, por, virgulas">
    <meta charset="author" content="Lucas Almeida">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Roboto:ital,wght@0,100..900;1,100..900&family=Stack+Sans+Headline:wght@200..700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

<body>

    <header>
        <div class="container">
            <div>
                <div class="logo-1"></div><!--logo-1-->
            </div>
            <div>
                <div class="logo-2"></div><!--logo-2-->
            </div>
            <div class="clear"></div><!--clear-->
        </div><!--container-->
    </header>

    <section class="cover-form">
        <div class="container bg">
            <div class="form-container">
                <h2>PODE ACREDITAR, POR DENTRO É AINDA MAIS BONITO</h2>

                <form>
                    <div class="form-wraper">
                        <p>*Nome Completo</p>
                        <input type="text" name="nome" required placeholder="Nome">
                    </div><!--form-wraper-->
                    <div class="form-wraper">
                        <p>E-mail</p>
                        <input type="text" name="e-mail" required placeholder="E-mail">
                    </div><!--form-wraper-->
                    <div class="form-wraper">
                        <p>Telefone</p>
                        <input type="text" name="telefone" required placeholder="Telefone">
                    </div><!--form-wraper-->

                    <div class="form-wraper">
                        <input type="submit" name="acao" value="Enviar">
                    </div><!--form-wraper-->

                    <div class="form-wraper">
                        <p>*Campos Obrigatórios</p>
                    </div><!--form-wraper-->

                </form>
            </div><!--form-container-->
        </div><!--container bg-->
    </section><!--cover-form-->

    <section class="chamada">
        <div class="container">
            <h2>Lorem ipsum dolor sit amet, consectetur adipiscing elit consectetur adipiscing</h2>
    </section><!--chamada-->
    </div><!--container-->
